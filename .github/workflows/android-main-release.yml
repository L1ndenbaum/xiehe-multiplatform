name: Android Main Release APK

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (main forbids HTTP cleartext)
        run: ./gradlew :androidApp:assembleDebug -PallowCleartextTraffic=false --stacktrace

      - name: Normalize APK name
        shell: bash
        run: |
          APK_PATH=$(ls androidApp/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK_PATH" xiehe-spine.apk

      - name: Compute Release Metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date +'%Y%m%d-%H%M')"
          TAG="main-${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Android Main APK ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          files: xiehe-spine.apk
          fail_on_unmatched_files: true
